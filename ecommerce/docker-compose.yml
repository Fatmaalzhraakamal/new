services:
  db:
    image: mysql:8
    environment:
      # Quoted so ':' in the password is valid YAML.
      MYSQL_ROOT_PASSWORD: "My:S3cr3t"
    ports:
      - "30306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ec-net
    restart: always

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - ec-net
    restart: always

  frontend:
    build: ./frontend
    ports:
      # Port 80 on Windows is often used by IIS; use 8080 on the host instead.
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ec-net
    restart: always

networks:
  ec-net:
    driver: bridge